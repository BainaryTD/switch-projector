<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Display</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #holdScreen {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            position: absolute;
            z-index: 10;
            color: white;
            flex-direction: column;
            transition: opacity 1.5s;
        }

        #holdText {
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        }

        #videoPlayer,
        #imagePlayer {
            width: 100%;
            height: 100%;
            display: none;
            background: #000;
            position: absolute;
            z-index: 5;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <div id="holdScreen">
        <div id="holdText">Projector App Standby 💤</div>
    </div>
    <div id="blackFade"
        style="position: absolute; top:0; left:0; width: 100%; height: 100%; background: #000; z-index: 8; opacity: 0; pointer-events: none; transition: opacity 0.8s;">
    </div>
    <video id="videoPlayer" muted></video>
    <img id="imagePlayer" style="display: none;" />
    <div id="exitHint"
        style="position:fixed;bottom:8px;right:12px;color:#888;font-size:11px;font-family:monospace;opacity:0.55;z-index:20;pointer-events:none;transition:opacity 1s;">
        Esc to exit fullscreen
    </div>
    <script src="display.js"></script>
    <script>
        (function () {
            const hint = document.getElementById('exitHint');
            if (hint) setTimeout(() => { hint.style.opacity = '0'; }, 3000);
        })();
    </script>
</body>

</html>
